<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clara Gómez González | Reservar cita</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1> Clara Gómez González</h1>
        <p class="subtitulo"> Orientadora educativa</p>
    </header>

    <nav class="menu">
        <a href="index.html" class="boton"> Inicio</a>
    </nav>

    <main>
        <h2>Reserva tu cita</h2>
        <p> Rellena el formulario, le llegará la confirmacion por correo</p>

        <form class="formulario">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" required>

            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono" inputmode="numeric" maxlength="9" pattern="[0-9]{9}"
                title="Introduce tu número de teléfono (9 dígitos)" required>

            <label for="consulta">Tipo de consulta</label>
            <select id="consulta" name="consulta" required>
                <option value="">--Elige una opcion--</option>
                <option value="individual">Orientación individual</option>
                <option value="familiar">Orientación familiar</option>
                <option value="academica">Orientación académica</option>
            </select>

            <fieldset>
                <legend>Modalidad</legend>
                <label><input type="radio" name="Modalidad" value="presencial" checked>Presencial</label>
                <label><input type="radio" name="Modalidad" value="online">Online</label>
            </fieldset>

            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" name="fecha" required>

            <label for="hora">Hora</label>
            <select id="hora" name="hora" required>
                <option value="">-- Elige una hora --</option>
                <option>10:00</option>
                <option>11:00</option>
                <option>12:00</option>
                <option>17:00</option>
                <option>18:00</option>
                <option>19:00</option>
            </select>

            <label for="mensaje">¿Quieres comentarme algo *opcional*</label>
            <textarea name="mensaje" id="mensaje" rows="4"></textarea>

            <label class="check">
                <input type="checkbox" required> Acepto la politica de privacidad
            </label>

            <button type="submit" class="boton"> Reservar cita</button>

        </form>

    </main>
</body>

</html>
